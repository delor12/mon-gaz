name: smartgas
description: Application mobile intelligente de surveillance de bouteille de gaz GPL.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Gestion d'état et navigation
  flutter_riverpod: ^2.5.1
  go_router: ^13.2.0

  # Réseau REST, WebSocket & MQTT
  dio: ^5.4.1
  web_socket_channel: ^2.4.5
  mqtt_client: ^10.0.1
  multicast_dns: ^0.3.2+6

  # Graphiques et visualisations
  fl_chart: ^0.66.2

  # Stockage local et persistance
  shared_preferences: ^2.2.2

  # Alertes et notifications
  flutter_local_notifications: ^17.0.0
  vibration: ^1.8.4

  # Utilitaires & typographie
  intl: ^0.19.0
  google_fonts: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
