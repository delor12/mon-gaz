name: Build Windows Desktop App (.exe)

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Build Web Application
        working-directory: ./web
        run: |
          npm ci
          npm run build

      - name: Copy Web Dist to Desktop
        run: |
          mkdir -p desktop/web-dist
          cp -r web/dist/* desktop/web-dist/
        shell: bash

      - name: Install Desktop Dependencies
        working-directory: ./desktop
        run: |
          npm install

      - name: Build Windows Executables (.exe Installer & Portable)
        working-directory: ./desktop
        run: |
          npm run dist:win

      - name: Upload Windows Executables as Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SmartGas-Windows-Desktop-x64
          path: |
            desktop/dist-electron/*.exe
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: desktop/dist-electron/*.exe
          draft: false
          prerelease: false
          generate_release_notes: true
